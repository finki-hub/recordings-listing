name: E2E

on:
  push:
    branches: [main, dev]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    uses: finki-hub/.github/.github/workflows/playwright.yaml@main
    with:
      install-command: npm ci --ignore-scripts
      test-command: npm run test:integration
  integration:
    name: Integration
    runs-on: ubuntu-latest
    needs: playwright
    if: ${{ always() }}
    timeout-minutes: 2
    steps:
      - env:
          PLAYWRIGHT_RESULT: ${{ needs.playwright.result }}
        run: '[ "$PLAYWRIGHT_RESULT" = success ]'
